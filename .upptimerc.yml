# KeivApp service status: https://status.keiv.app and the "Status" page of keiv.app, which reads
# history/summary.json and the issues labelled "status" (keiv.app repo, inc/status.php).
#
# NOT RUNNING YET: GitHub Actions are disabled in this repository until production
# (app.keiv.app) starts; staging sits behind a password and is not for customers. To start:
# add the GH_PAT secret (a token of the owner, never in this file), enable Actions, add the DNS
# record status.keiv.app (CNAME to apm24-development.github.io).
#
# The slugs are labels of incidents too (keiv.app reads them): keep them short and do not rename.
owner: apm24-development
repo: keiv-status

sites:
  - name: Panel KeivApp
    slug: panel
    url: https://app.keiv.app/api/health
    expectedStatusCodes: [200]
  - name: Logowanie
    slug: logowanie
    url: https://app.keiv.app/login
    expectedStatusCodes: [200]
  # The platform and AI checks read the app's public status (marketing_app, /api/public/status,
  # to be built): 200 with "degraded" in the body is a slowdown, any other code an outage.
  - name: Wysyłka zmian do Allegro
    slug: allegro
    url: https://app.keiv.app/api/public/status/allegro
    __dangerous__body_degraded: degraded
  - name: Wysyłka zmian do Kauflandu
    slug: kaufland
    url: https://app.keiv.app/api/public/status/kaufland
    __dangerous__body_degraded: degraded
  - name: Generowanie treści AI
    slug: ai
    url: https://app.keiv.app/api/public/status/ai
    __dangerous__body_degraded: degraded
  - name: Strona keiv.app
    slug: strona
    url: https://keiv.app/
    expectedStatusCodes: [200]

status-website:
  cname: status.keiv.app
  name: KeivApp
  introTitle: "Stan usług KeivApp"
  introMessage: "Sprawdzamy usługi co 5 minut, poza naszymi serwerami. Opisy awarii i prac znajdziesz poniżej."
  navbar:
    - title: Status
      href: /
    - title: keiv.app
      href: https://keiv.app/
